name: Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Verify release artifacts
        run: test -f release/lightweight-livesync.zip && test -f release/lightweight-livesync/main.js && test -f release/lightweight-livesync/sync-worker.js

      - name: Upload release folder
        uses: actions/upload-artifact@v4
        with:
          name: lightweight-livesync-release
          path: release/lightweight-livesync

      - name: Upload release zip
        uses: actions/upload-artifact@v4
        with:
          name: lightweight-livesync-zip
          path: release/lightweight-livesync.zip
