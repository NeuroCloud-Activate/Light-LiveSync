name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build, attest, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build plugin
        run: npm run build

      - name: Run tests
        run: node tests/run-all.mjs

      - name: Package release
        run: |
          node scripts/package-release.mjs
          node scripts/verify-release.mjs

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            release/light-livesync/main.js
            release/light-livesync/styles.css
            release/light-livesync/manifest.json
            release/light-livesync/sync-worker.js
            release/light-livesync.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            release/light-livesync.zip \
            release/light-livesync/manifest.json \
            release/light-livesync/main.js \
            release/light-livesync/sync-worker.js \
            release/light-livesync/styles.css \
            --title "Light-LiveSync $TAG_NAME" \
            --notes "Light-LiveSync $TAG_NAME release assets were built, tested, packaged, verified, and attested by GitHub Actions."
